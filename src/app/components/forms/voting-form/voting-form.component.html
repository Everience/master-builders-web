<button class="back-btn" (click)="goBack()">Back to Home</button>
<div class="main">
  <div class="form-container">

    <form [formGroup]="votingForm" (ngSubmit)="onSubmit()" class="voting-form">

      <div class="form-group">
        <label>Project*</label>
        <app-project-search-autocomplete
          formControlName="projectLookup"
          [filterVotableOnly]="true"
          [resolveSearchLocally]="true"
          (projectResolved)="onProjectLookupResolved($event)"
        />
      </div>

      <div class="form-group">
        <label>Project code</label>
        <input type="text" formControlName="projectCode" readonly class="readonly-dim" />
      </div>
      <div class="form-group">
        <label>Project name</label>
        <input type="text" formControlName="projectName" readonly class="readonly-dim" />
      </div>

      <div class="form-group">
        <label>Project Status</label>
        <input type="text" formControlName="projectStatus" readonly />
      </div>

      <div class="form-group">
        <label>Innovation Area</label>
        <input type="text" formControlName="innovationArea" readonly />
      </div>
      
      <div class="form-group">
        <label>Region</label>
        <input type="text" formControlName="region" readonly />
      </div>
      
      <div class="form-group">
        <label>Market Segment</label>
        <input type="text" formControlName="marketSegment" readonly />
      </div>

      <div class="form-group" *ngIf="projectDocsLink">
        <label>Project Documentation</label>
        <a [href]="projectDocsLink" target="_blank" class="file-chip">
          <span class="file-chip__icon">📁</span>
          <span class="file-chip__name">View project files on SharePoint</span>
        </a>
      </div>

      <div class="form-group">
        <label>Notes</label>
        <textarea formControlName="notes" rows="3"></textarea>
      </div>

      <div class="form-group">
        <label>Score*<br>
          <span style="font-size: 0.75rem;">Rate from 1 (low) to 5 (high)</span><br>
          <span style="font-size: 0.75rem;">- Sales & Marketing voters: market potential</span><br>
          <span style="font-size: 0.75rem;">- Technical voters: technical probability of success</span>
        </label>
        <select formControlName="score">
          <option value="">Select score</option>
          <option *ngFor="let score of scores" [value]="score">{{ score }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Reasoning for the score*</label>
        <textarea formControlName="scoreReason" rows="3"
          style="border-bottom: 2px solid #007acc; border-radius: 6px 6px 0 0;"></textarea>
      </div>

      <div class="button-container">
        <button type="submit" [disabled]="votingForm.invalid || !hasSelectedProject || isSubmitting">
          {{ isSubmitting ? 'Submitting…' : 'Submit' }}
        </button>
      </div>
    </form>
  </div>
</div>
