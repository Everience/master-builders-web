<button class="back-btn" (click)="goBack()">Back to Home</button>
<div class="main">
    <div class="form-container">

        <form [formGroup]="projectStatusForm" (ngSubmit)="onSubmit()" class="voting-form">
            <div class="form-group">
                <label>Project Code*</label>
                <div class="code-input-wrapper">
                    <input type="text" formControlName="projectCode" (keydown.enter)="$event.preventDefault(); searchProject()" />
                    <button type="button" class="search-btn" (click)="searchProject()" [disabled]="isSearching">
                        <span *ngIf="!isSearching">🔍</span>
                        <span *ngIf="isSearching">⏳</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>Project Status*</label>
                <select formControlName="projectStatus">
                    <option value="">Select status</option>
                    <option *ngFor="let status of projectStatuses" [value]="status">{{ status }}</option>
                </select>
            </div>

            <div class="form-group" *ngIf="currentProjectId">
                <label>Resulting Visibility</label>
                <div class="visibility-hint" [class.active]="getVisibility() === 'active'"
                    [class.inactive]="getVisibility() === 'inactive'">
                    {{ getVisibilityLabel() }}
                </div>
            </div>
            <div class="button-container">
                <button type="submit" [disabled]="projectStatusForm.invalid || isSubmitting || !currentProjectId">
                    {{ isSubmitting ? 'Saving...' : 'Submit' }}
                </button>
            </div>
        </form>
    </div>
</div>
