<button class="back-btn" (click)="goBack()">Back to Home</button>
<div class="main">
    <div class="form-container">

        <form [formGroup]="userStatusForm" (ngSubmit)="onSubmit()" class="voting-form">
            <div class="form-group">
                <label>User Email*</label>
                <div class="code-input-wrapper">
                    <input type="email" formControlName="userEmail" (keydown.enter)="$event.preventDefault(); searchUser()"
                        placeholder="user@company.com" />
                    <button type="button" class="search-btn" (click)="searchUser()" [disabled]="isSearching">
                        <span *ngIf="!isSearching">🔍</span>
                        <span *ngIf="isSearching">⏳</span>
                    </button>
                </div>
            </div>
            
            <!-- Department status overview — shown after search -->
            <div class="form-group" *ngIf="matchedUsers.length > 0">
                <label>Department Records</label>
                <div class="dept-banners">
                    <div *ngFor="let u of matchedUsers" class="dept-banner"
                        [class.dept-banner--active]="u.user_status?.toLowerCase() === 'active'"
                        [class.dept-banner--inactive]="u.user_status?.toLowerCase() !== 'active'" (click)="selectUser(u)"
                        [class.dept-banner--selected]="currentUser?.department === u.department">
                        <span class="dept-banner__name">{{ u.department.charAt(0).toUpperCase() + u.department.slice(1) }}</span>
                        <span class="dept-banner__status">{{ u.user_status }}</span>
                    </div>
                </div>
                <p style="font-size: 0.75rem; color: #6b7a99; margin-top: 6px;">
                    Click a department to select it and edit.
                </p>
            </div>
            
            <!-- Fields shown after user is selected -->
            <ng-container *ngIf="currentUser">
                <div class="form-group">
                    <label>New Department*</label>
                    <select formControlName="newDepartment">
                        <option value="">Select department</option>
                        <option *ngFor="let dept of departments" [value]="dept">{{ dept }}</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>User Status*</label>
                    <div class="radio-buttons-container">
                        <div class="radio-label-container">
                            <input type="radio" formControlName="userStatus" value="active" id="active" />
                            <label for="active">Active</label>
                        </div>
                        <div class="radio-label-container">
                            <input type="radio" formControlName="userStatus" value="inactive" id="inactive" />
                            <label for="inactive">Inactive</label>
                        </div>
                    </div>
                </div>
                <div class="button-container">
                    <button type="submit" [disabled]="userStatusForm.invalid || isSubmitting || !currentUser">
                        {{ isSubmitting ? 'Saving...' : 'Submit' }}
                    </button>
                </div>
            </ng-container>
        </form>
    </div>
</div>
