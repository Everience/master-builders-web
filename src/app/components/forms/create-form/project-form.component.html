<!--CREATE PROJECT FORM-->
<button class="back-btn" (click)="goBack()">Back to Home</button>
<div class="main">
  <div class="form-container">
    <h2>Create New Project</h2><br>

    <form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="project-form">
      <div class="form-group">
        <label>Project Code</label>
        <input type="text" formControlName="projectCode" />
      </div>

      <div class="form-group">
        <label>Project Name</label>
        <input type="text" formControlName="projectName" />
      </div>

      <div class="form-group">
        <label>Region</label>
        <select formControlName="region">
          <option value="">Select region</option>
          <option *ngFor="let region of regions" [value]="region">{{ region }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Market Segment</label>
        <select formControlName="marketSegment">
          <option value="">Select segment</option>
          <option *ngFor="let segment of marketSegments" [value]="segment">{{ segment }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Innovation Area</label>
        <select formControlName="innovationArea">
          <option value="">Select area</option>
          <option *ngFor="let area of innovationAreas" [value]="area">{{ area }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Project Phase</label>
        <select formControlName="projectPhase">
          <option value="">Select phase</option>
          <option *ngFor="let phase of projectPhases" [value]="phase">{{ phase }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Project Status</label>
        <select formControlName="projectStatus">
          <option value="">Select status</option>
          <option *ngFor="let status of projectStatuses" [value]="status">{{ status }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Notes</label>
        <textarea formControlName="notes" rows="3"></textarea>
      </div>

      <div class="form-group">
        <label>
          Attachments
          <span class="attachments-hint">Max 10 files, up to 10MB each — PDF, Word, Excel, images</span>
        </label>
        <input
          type="file"
          id="fileInput"
          multiple
          accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.xlsx,.xls"
          (change)="onFileSelected($event)"
          class="file-input-hidden"
        />
        <button type="button" class="file-chip file-chip--action" (click)="triggerFileInput()">
          <img src="../../../../assets/icons/folder (2).png" alt="" class="file-chip__img" />
          <span>Choose files</span>
        </button>
        <p class="attachments-empty" *ngIf="uploadedFiles.length === 0">No files selected yet.</p>
        <ul class="file-list" *ngIf="uploadedFiles.length">
          <li *ngFor="let file of uploadedFiles; let i = index">
            <span class="file-list__main">
              <span class="file-list__icon">{{ getFileIcon(file.name) }}</span>
              <span class="file-list__name">{{ file.name }}</span>
              <span class="file-list__size">({{ (file.size / 1024 / 1024).toFixed(2) }} MB)</span>
            </span>
            <button type="button" class="file-list__remove" (click)="removeFile(i)">Remove</button>
          </li>
        </ul>
      </div>

      <div class="button-container">
        <button type="submit" [disabled]="projectForm.invalid">Submit</button>
      </div>
    </form>
  </div>
</div>
