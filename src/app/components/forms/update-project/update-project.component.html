<button class="back-btn" (click)="goBack()">Back to Home</button>
<div class="main">
    <div class="form-container">

        <form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="project-form">

            <div class="form-group">
                <label>Project Code</label>
                <div class="code-input-wrapper">
                    <input type="text" formControlName="projectCode" (keydown.enter)="$event.preventDefault(); searchProject()" />
                    <button type="button" class="search-btn" (click)="searchProject()" [disabled]="isSearching">
                        <span *ngIf="!isSearching">🔍</span>
                        <span *ngIf="isSearching">⏳</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>Project Name</label>
                <input type="text" formControlName="projectName" />
            </div>

            <div class="form-group">
                <label>Project Status</label>
                <select formControlName="projectStatus">
                    <option value="">Select status</option>
                    <option *ngFor="let status of projectStatuses" [value]="status">{{ status }}</option>
                </select>
            </div>

            <div class="form-group">
                <label>Innovation Area</label>
                <select formControlName="innovationArea">
                    <option value="">Select area</option>
                    <option *ngFor="let area of innovationAreas" [value]="area">{{ area }}</option>
                </select>
            </div>

            <div class="form-group">
                <label>Region</label>
                <select formControlName="region">
                    <option value="">Select region</option>
                    <option *ngFor="let region of regions" [value]="region">{{ region }}</option>
                </select>
            </div>

            <div class="form-group">
                <label>Market Segment</label>
                <select formControlName="marketSegment">
                    <option value="">Select segment</option>
                    <option *ngFor="let segment of marketSegments" [value]="segment">{{ segment }}</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Update Notes* <span class="editable-hint">editable</span></label>
                <textarea formControlName="notes" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label>New Project Phase* <span class="editable-hint">editable</span></label>
                <select formControlName="projectPhase">
                    <option value="">Select phase</option>
                    <option *ngFor="let phase of projectPhases" [value]="phase">{{ phase }}</option>
                </select>
            </div>
            <div class="form-group">
                <label>Attachments Link <span class="editable-hint">editable · optional</span></label>
                <input type="text" formControlName="attachmentsLink" placeholder="E.g.: https://netecoorg.sharepoint.com/..." />
            </div>

            <div class="button-container">
                <button type="submit" [disabled]="projectForm.invalid || isSubmitting || !currentProjectId">
                    {{ isSubmitting ? 'Saving...' : 'Submit' }}
                </button>
            </div>
        </form>
    </div>
</div>
