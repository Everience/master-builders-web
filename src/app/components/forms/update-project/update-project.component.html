<button class="back-btn" (click)="goBack()">Back to Home</button>
<div class="main">
    <div class="form-container">

        <form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="project-form">
            <h2>Update Project</h2><br>

            <div class="form-group">
                <label>Project Code</label>
                <div class="code-input-wrapper">
                    <div class="code-autocomplete">
                        <input
                            type="text"
                            formControlName="projectCode"
                            maxlength="32"
                            autocomplete="off"
                            spellcheck="false"
                            (focus)="onProjectCodeFocus()"
                            (blur)="onProjectCodeBlur()"
                            (input)="onProjectCodeInput()"
                            (keydown)="onProjectCodeKeydown($event)"
                        />
                        <div
                            class="code-suggestions-panel"
                            *ngIf="showCodeSuggestions && getProjectCodeQuery().length >= minCharsForSuggestions"
                            (mousedown)="$event.preventDefault()"
                        >
                            <div class="code-suggestions-loading" *ngIf="isLoadingProjectCodes">Loading suggestions…</div>
                            <ul class="code-suggestions" *ngIf="!isLoadingProjectCodes && codeSuggestions.length">
                                <li
                                    *ngFor="let s of codeSuggestions; trackBy: trackSuggestionCode; let i = index"
                                    class="code-suggestion"
                                    [class.code-suggestion--active]="i === suggestionActiveIndex"
                                    (mousedown)="selectSuggestion(s, $event)"
                                >
                                    <span class="code-suggestion__code">{{ s.code }}</span>
                                    <span class="code-suggestion__name" *ngIf="s.name">{{ s.name }}</span>
                                </li>
                            </ul>
                            <div class="code-suggestions-empty" *ngIf="!isLoadingProjectCodes && codeSuggestionsLoadError">
                                Could not load suggestions. Enter the full code and press Search.
                            </div>
                            <div class="code-suggestions-empty" *ngIf="!isLoadingProjectCodes && projectCodesLoaded && !codeSuggestions.length && !codeSuggestionsLoadError">
                                No project codes match this prefix.
                            </div>
                        </div>
                    </div>
                    <button type="button" class="search-btn" (click)="searchProject()" [disabled]="isSearching">
                        <span *ngIf="!isSearching">🔍</span>
                        <span *ngIf="isSearching">⏳</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>Project Name</label>
                <input type="text" formControlName="projectName" />
            </div>

            <div class="form-group">
                <label>Project Status</label>
                <select formControlName="projectStatus">
                    <option value="">Select status</option>
                    <option *ngFor="let status of projectStatuses" [value]="status">{{ status }}</option>
                </select>
            </div>

            <div class="form-group">
                <label>Innovation Area</label>
                <select formControlName="innovationArea">
                    <option value="">Select area</option>
                    <option *ngFor="let area of innovationAreas" [value]="area">{{ area }}</option>
                </select>
            </div>

            <div class="form-group">
                <label>Region</label>
                <select formControlName="region">
                    <option value="">Select region</option>
                    <option *ngFor="let region of regions" [value]="region">{{ region }}</option>
                </select>
            </div>

            <div class="form-group">
                <label>Market Segment</label>
                <select formControlName="marketSegment">
                    <option value="">Select segment</option>
                    <option *ngFor="let segment of marketSegments" [value]="segment">{{ segment }}</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Update Notes* <span class="editable-hint">editable</span></label>
                <textarea formControlName="notes" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label>New Project Phase* <span class="editable-hint">editable</span></label>
                <select formControlName="projectPhase">
                    <option value="">Select phase</option>
                    <option *ngFor="let phase of projectPhases" [value]="phase">{{ phase }}</option>
                </select>
            </div>
            <!-- existing files — shown after search, once BE adds files to getProjectByCode -->
            <div class="form-group" *ngIf="currentProjectId && attachmentsLink">
                <label>Existing Files</label>
                <a [href]="attachmentsLink" target="_blank" class="file-chip">
                    <img src="../../../../assets/icons/folder (2).png" alt="folder-icon" style="width: 15px;">
                    <span class="file-chip__name">View project files on SharePoint</span>
                </a>
            </div>
            
            <!-- new files — optional -->
            <div class="form-group">
                <label>
                    Add New Files <span class="editable-hint">editable · optional</span>
                    <br>
                    <span style="font-size: 0.75rem;">Max 10 files, up to 10MB each</span>
                </label>
            
                <input type="file" id="updateFileInput" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.xlsx"
                    (change)="onFileSelected($event)" style="display: none;" />
            
                <button type="button" class="file-chip" (click)="triggerFileInput()">
                    <img src="../../../../assets/icons/folder (2).png" alt="folder-icon" style="width: 15px;">
                    Choose Files
                </button>
            
                <ul class="file-list" *ngIf="newFiles.length">
                    <li *ngFor="let file of newFiles; let i = index">
                        {{ getFileIcon(file.name) }} {{ file.name }}
                        <span style="font-size: 0.75rem; color: #6b7a99;">
                            ({{ (file.size / 1024 / 1024).toFixed(2) }} MB)
                        </span>
                        <button type="button" (click)="removeNewFile(i)">Remove</button>
                    </li>
                </ul>
            </div>

            <div class="button-container">
                <button type="submit" [disabled]="projectForm.invalid || isSubmitting || !currentProjectId">
                    {{ isSubmitting ? 'Saving...' : 'Submit' }}
                </button>
            </div>
        </form>
    </div>
</div>
