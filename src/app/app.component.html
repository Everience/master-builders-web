<main class="container">
  <app-toast></app-toast>
  <div class="content">
    <div class="header">
      <img src="../assets/logo.png" alt="" class="logo">
      @if (isDashboard) {
        <a class="button" href="/login" (click)="logout()">
          
          <span style="font-weight: 500; font-size: 1.2rem;">{{ account?.name}}</span>
          
          <!--<img src="../assets/icons/meerkat.png" class="logout-img">  -->
          <div class="logout-user">
            <img src="../assets/icons/logout.png" alt="logout-icon" width="45px">
          </div>
          <div class="logout" >LOGOUT</div>
        </a>
      }
    </div>
    @if (msalInitialized) {
      <router-outlet />
    }
  </div>
</main>
